name: Deploy Kotlin Academy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp asset URLs with the commit ID (cache busting)
        run: |
          VERSION="${GITHUB_SHA::8}"
          sed -i "s/__BUILD__/${VERSION}/g" kotlin-academy/*.html
          echo "Stamped assets with ?v=${VERSION}"
          ! grep -l "__BUILD__" kotlin-academy/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: kotlin-academy
      - id: deployment
        uses: actions/deploy-pages@v4
