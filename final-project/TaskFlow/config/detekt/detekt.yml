# Project overrides on top of detekt's default rule set (buildUponDefaultConfig = true).
# Only deviations are listed; every other default rule stays active.
# Compose-specific settings follow detekt's "Compose" recommendations.

naming:
  FunctionNaming:
    # Composables are PascalCase nouns (Kotlin & Compose conventions).
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Z0-9]*'

complexity:
  LongParameterList:
    # Stateless composables take state + one callback per event by design (state hoisting).
    ignoreAnnotated: ['Composable']
    ignoreDefaultParameters: true
  LongMethod:
    # A screen's layout reads top-to-bottom; split it when it hurts readability, not at 60 lines.
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    # Color tokens and dp values in the theme are named by the property they initialize.
    ignorePropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
  UnusedPrivateMember:
    # @Preview functions are used by Android Studio, not by code.
    ignoreAnnotated: ['Preview']
  MaxLineLength:
    maxLineLength: 100
